<!doctype html>
<html lang="en" data-style="clean">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalimati Dictionary</title>
<meta name="description" content="Your private English–Arabic dictionary: save new words, hear them, and review them.">
<meta name="theme-color" content="#F7F8FB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;600&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Noto+Naskh+Arabic:wght@400;600&family=Sora:wght@400;600;700&family=Noto+Kufi+Arabic:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try{var s=JSON.parse(localStorage.getItem("kalimati-settings")||"{}");if(s.style)document.documentElement.dataset.style=s.style;if(s.theme&&s.theme!=="system")document.documentElement.dataset.theme=s.theme}catch(e){}</script>
</head>
<body>
<div id="app">
  <header class="top">
    <h1 id="viewTitle">Search</h1>
    <span id="topInfo" class="top-info"></span>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav class="tabs" aria-label="Main">
    <button data-tab="search" class="tab on"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span>Search</span></button>
    <button data-tab="mine" class="tab"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg><span>My words</span></button>
    <button data-tab="add" class="tab add" aria-label="Add a word"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button data-tab="review" class="tab"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="13" height="14" rx="2"/><path d="M8 3h10a2 2 0 0 1 2 2v12"/></svg><span>Review</span><b id="dueBadge" class="badge" hidden></b></button>
    <button data-tab="settings" class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span>Settings</span></button>
  </nav>
  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
<script src="pron.js"></script>
<script src="app.js"></script>
</body>
</html>
